<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Private bilingual chat powered by a local Ollama model" />
    <title>Local LLM Chat</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">L</div>
          <div>
            <h1>Local LLM Chat</h1>
            <p><span id="status-dot" class="status-dot"></span><span id="status-text">Checking Ollama…</span></p>
          </div>
        </div>
        <div class="header-actions">
          <button id="export-json" class="button ghost" type="button">Export JSON</button>
          <button id="export-md" class="button ghost" type="button">Export MD</button>
          <button id="clear-chat" class="button danger" type="button">Clear</button>
        </div>
      </header>

      <section id="messages" class="messages" aria-live="polite">
        <div id="welcome" class="welcome">
          <div class="welcome-icon">অ</div>
          <h2>আপনার private AI assistant</h2>
          <p>বাংলা বা English-এ লিখুন। আপনার chat ও model আপনার নিজের machine-এই থাকে।</p>
          <div class="suggestions">
            <button class="suggestion" type="button">বাংলায় একটি ছোট কবিতা লেখো</button>
            <button class="suggestion" type="button">Explain FastAPI in simple English</button>
          </div>
        </div>
      </section>

      <section class="composer-wrap">
        <div class="controls">
          <label>
            <span>Language</span>
            <select id="language">
              <option value="auto">Auto</option>
              <option value="bn">বাংলা</option>
              <option value="en">English</option>
            </select>
          </label>
          <label>
            <span>Model</span>
            <select id="model"><option value="">Default model</option></select>
          </label>
        </div>
        <form id="chat-form" class="composer">
          <label class="sr-only" for="prompt">Message</label>
          <textarea id="prompt" rows="1" maxlength="8000" placeholder="Message your local model…" required></textarea>
          <button id="send" class="send" type="submit" aria-label="Send message">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12 20 4l-6 16-2.7-6.6L4 12Zm7.3 1.4L20 4" /></svg>
          </button>
        </form>
        <p class="privacy-note">Runs locally with Ollama · Enter to send · Shift+Enter for a new line</p>
      </section>
    </main>
    <script src="/assets/app.js" defer></script>
  </body>
</html>
